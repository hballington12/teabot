[project]
name = "teabot-polls"
version = "0.1.0"
description = "The tutorial's plugin: polls with a job that posts the results"
requires-python = ">=3.12"
dependencies = ["teabot"]

[project.entry-points."teabot.plugins"]
polls = "teabot_polls:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_polls"]

[tool.uv.sources]
teabot = { workspace = true }
