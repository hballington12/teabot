[project]
name = "teabot"
version = "1.0.0.dev0"
description = "A plugin-based Discord bot framework, built to self-host and to scale"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "discord-py>=2.6",
    "mcp>=2.3,<3",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "starlette>=0.47",
    "typer>=0.29",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
testing = [
    "psycopg[binary]>=3.3",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-postgresql>=10.0",
]

[project.scripts]
teabot = "teabot.cli:app"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "coverage>=7.10",
    "httpx>=0.28",
    "import-linter>=2.16",
    "psycopg[binary]>=3.3",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-postgresql>=10.0",
    "ruff>=0.17",
    "teabot-announcements",
    "teabot-devtools",
]
duplicate-check = ["teabot-devtools-twin"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot"]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
teabot-announcements = { workspace = true }
teabot-devtools = { workspace = true }
teabot-devtools-twin = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts/release"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF", "ASYNC", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["teabot", "teabot_announcements", "teabot_devtools", "teabot_devtools_twin"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60
max-nested-blocks = 3

[tool.pyright]
include = ["src", "tests", "plugins", "scripts"]
# The release scripts import release_lib from their own directory (WP7.5).
extraPaths = ["scripts/release"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
pythonpath = ["scripts/release"]
addopts = "-p teabot.testing.fixtures"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# discord.py's escape_markdown passes re.sub's count positionally, which Python 3.13 deprecates. Only that one
# warning from that one module is hidden, so teabot's own warnings still show.
filterwarnings = ["ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils"]

[tool.importlinter]
root_packages = ["teabot", "teabot_announcements", "teabot_devtools"]

[[tool.importlinter.contracts]]
name = "The plugin SDK does not depend on the core's internals (D45)"
type = "forbidden"
source_modules = ["teabot.sdk"]
forbidden_modules = [
    "teabot.adapters",
    "teabot.app",
    "teabot.assembly",
    "teabot.auth",
    "teabot.builtin",
    "teabot.cli",
    "teabot.core",
    "teabot.db",
    "teabot.envfile",
    "teabot.health",
    "teabot.logs",
    "teabot.runtime",
    "teabot.settings",
    "teabot.testing",
    "teabot.web",
]

[[tool.importlinter.contracts]]
name = "First-party plugins import only the SDK (D45)"
type = "forbidden"
source_modules = ["teabot_announcements", "teabot_devtools"]
forbidden_modules = [
    "teabot.adapters",
    "teabot.app",
    "teabot.assembly",
    "teabot.auth",
    "teabot.builtin",
    "teabot.cli",
    "teabot.core",
    "teabot.db",
    "teabot.envfile",
    "teabot.health",
    "teabot.logs",
    "teabot.runtime",
    "teabot.settings",
    "teabot.testing",
    "teabot.web",
]
