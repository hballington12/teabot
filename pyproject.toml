[project]
name = "teapot"
version = "0.1.0.dev0"
description = "A plugin-based Discord bot framework, built to self-host and to scale"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "discord-py>=2.6",
    "mcp>=2.3,<3",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "starlette>=0.47",
    "typer>=0.29",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
testing = [
    "psycopg[binary]>=3.3",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-postgresql>=10.0",
]

[project.scripts]
teapot = "teapot.cli:app"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "coverage>=7.10",
    "httpx>=0.28",
    "import-linter>=2.16",
    "psycopg[binary]>=3.3",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-postgresql>=10.0",
    "ruff>=0.17",
    "teapot-announcements",
    "teapot-devtools",
]
duplicate-check = ["teapot-devtools-twin"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teapot"]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
teapot-announcements = { workspace = true }
teapot-devtools = { workspace = true }
teapot-devtools-twin = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF", "ASYNC", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["teapot", "teapot_announcements", "teapot_devtools", "teapot_devtools_twin"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60
max-nested-blocks = 3

[tool.pyright]
include = ["src", "tests", "plugins"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
addopts = "-p teapot.testing.fixtures"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_packages = ["teapot", "teapot_announcements", "teapot_devtools"]

[[tool.importlinter.contracts]]
name = "The plugin SDK does not depend on the core's internals (D45)"
type = "forbidden"
source_modules = ["teapot.sdk"]
forbidden_modules = [
    "teapot.app",
    "teapot.cli",
    "teapot.core",
    "teapot.db",
    "teapot.envfile",
    "teapot.health",
    "teapot.logs",
    "teapot.runtime",
    "teapot.settings",
    "teapot.web",
]

[[tool.importlinter.contracts]]
name = "First-party plugins import only the SDK (D45)"
type = "forbidden"
source_modules = ["teapot_announcements", "teapot_devtools"]
forbidden_modules = [
    "teapot.app",
    "teapot.cli",
    "teapot.core",
    "teapot.db",
    "teapot.envfile",
    "teapot.health",
    "teapot.logs",
    "teapot.runtime",
    "teapot.settings",
    "teapot.web",
    "teapot.testing",
]
