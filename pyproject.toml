[project]
name = "teapot"
version = "0.1.0.dev0"
description = "A plugin-based Discord bot framework, built to self-host and to scale"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.29",
]

[project.scripts]
teapot = "teapot.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "psycopg[binary]>=3.3",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-postgresql>=10.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teapot"]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF", "ASYNC", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60
max-nested-blocks = 3

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_packages = ["teapot"]

[[tool.importlinter.contracts]]
name = "The plugin SDK does not depend on the core's internals (D45)"
type = "forbidden"
source_modules = ["teapot.sdk"]
forbidden_modules = ["teapot.cli"]
