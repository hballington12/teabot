name: teabot
# The instance template's quick setup: the bot and Postgres 16 on one machine. `./setup.sh` starts it.
# Compose reads `.env` next to this file: TEABOT_DB_OWNER_PASSWORD, and TEABOT_UID and TEABOT_GID. The owner
# password goes to both services from there, so it is written once.
# teabot's own development uses only the postgres service: `docker compose -f template/compose.yaml up -d postgres`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: teabot_owner
      POSTGRES_PASSWORD: ${TEABOT_DB_OWNER_PASSWORD:-teabot}
      POSTGRES_DB: teabot
    ports:
      - "127.0.0.1:${TEABOT_DB_PORT:-55432}:5432"
    volumes:
      - teabot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teabot_owner -d teabot"]
      interval: 2s
      timeout: 3s
      retries: 30

  bot:
    build:
      context: .
    # The env file is mounted, not loaded, so `teabot init` can write the passwords it generates into it. It
    # holds secrets and is kept at mode 0600, so the bot runs as the file's owner: your user, 1000 by default.
    user: "${TEABOT_UID:-1000}:${TEABOT_GID:-1000}"
    volumes:
      - ./teabot.env:/app/teabot.env
    environment:
      TEABOT_DB_HOST: postgres
      TEABOT_DB_PORT: "5432"
      TEABOT_DB_OWNER_PASSWORD: ${TEABOT_DB_OWNER_PASSWORD:-teabot}
      TEABOT_HTTP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${TEABOT_HTTP_PORT:-8780}:8780"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  # uv, for changing the instance's plugins without installing uv: `docker compose run --rm uv add teabot-foo`.
  # It is in the tools profile, so `docker compose up` never starts it. It runs as your user, so the files it
  # writes are yours, and keeps its cache in /tmp. UV_NO_SYNC stops `uv add` and `uv lock` building an
  # environment here; the bot's image installs the plugins when it is rebuilt.
  uv:
    image: ghcr.io/astral-sh/uv:0.9.9-python3.12-bookworm-slim
    profiles: [tools]
    entrypoint: ["uv"]
    user: "${TEABOT_UID:-1000}:${TEABOT_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_NO_SYNC: "1"

volumes:
  teabot-pgdata:
