name: teapot
# The instance template's Compose file (D43).
# For now it only holds Postgres, used for development and tests.
# The bot service is added in WP5.1.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: teapot_owner
      POSTGRES_PASSWORD: ${TEAPOT_DB_OWNER_PASSWORD:-teapot}
      POSTGRES_DB: teapot
    ports:
      - "127.0.0.1:${TEAPOT_DB_PORT:-55432}:5432"
    volumes:
      - teapot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teapot_owner -d teapot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  teapot-pgdata:
