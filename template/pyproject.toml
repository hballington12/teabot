[project]
name = "teabot-instance"
version = "0.1.0"
description = "One teabot instance: the plugins it runs, and how it is deployed (D42, D43)."
requires-python = ">=3.12"
dependencies = [
    "teabot>=1.0,<2",
    # First-party plugins this instance runs. Add or remove them here, then `uv lock`.
    "teabot-announcements>=1.0,<2",
]

[tool.uv]
package = false

# Your own plugins live in plugins/<id>/ as workspace members (D44): `uv run teabot new-plugin <id>`.
[tool.uv.workspace]
members = ["plugins/*"]

# uv.lock pins the exact versions. Upgrade with `uv lock --upgrade-package teabot --upgrade-package
# teabot-announcements`, then rebuild or deploy.
