[project]
name = "teapot-instance"
version = "0.1.0"
description = "One teapot instance: the plugins it runs, and how it is deployed (D42, D43)."
requires-python = ">=3.12"
dependencies = [
    "teapot",
    # First-party plugins this instance runs. Add or remove them here, then `uv lock`.
    "teapot-announcements",
]

[tool.uv]
package = false

# Your own plugins live in plugins/<id>/ as workspace members (D44): `uv run teapot new-plugin <id>`.
[tool.uv.workspace]
members = ["plugins/*"]

# Until teapot is published (M7), it and its first-party plugins come from GitHub. uv.lock pins the exact
# commit; upgrade with `uv lock --upgrade-package teapot --upgrade-package teapot-announcements`.
[tool.uv.sources]
teapot = { git = "ssh://git@github.com/hballington12/teapot.git", branch = "main" }
teapot-announcements = { git = "ssh://git@github.com/hballington12/teapot.git", branch = "main", subdirectory = "plugins/announcements" }
