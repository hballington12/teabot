[project]
name = "teabot-instance"
version = "0.1.0"
description = "One teabot instance: the plugins it runs, and how it is deployed (D42, D43)."
requires-python = ">=3.12"
dependencies = [
    "teabot",
    # First-party plugins this instance runs. Add or remove them here, then `uv lock`.
    "teabot-announcements",
]

[tool.uv]
package = false

# Your own plugins live in plugins/<id>/ as workspace members (D44): `uv run teabot new-plugin <id>`.
[tool.uv.workspace]
members = ["plugins/*"]

# Until teabot is published (M7), it and its first-party plugins come from GitHub. uv.lock pins the exact
# commit; upgrade with `uv lock --upgrade-package teabot --upgrade-package teabot-announcements`.
[tool.uv.sources]
teabot = { git = "ssh://git@github.com/hballington12/teabot.git", branch = "main" }
teabot-announcements = { git = "ssh://git@github.com/hballington12/teabot.git", branch = "main", subdirectory = "plugins/announcements" }
