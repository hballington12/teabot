# Continuous WAL archiving to the pgBackRest repository (D37). setup-backups.sh installs this file next to
# teapot.conf once the repository is reachable, then restarts Postgres, since archive_mode needs a restart.
archive_mode = on
archive_command = 'pgbackrest --stanza=teapot archive-push %p'
# Push a partly filled WAL segment after a minute, so a quiet database still loses at most about a minute.
archive_timeout = 60
