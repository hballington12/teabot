# Postgres settings for teapot on a small shared host (D37). setup-host.sh installs this file into the
# cluster's conf.d directory, for example /etc/postgresql/16/main/conf.d/teapot.conf.

# The Unix socket only: nothing listens on a network port.
listen_addresses = ''

# Sized for a 2 GB host that runs other services too. teapot's pools hold at most a few dozen connections.
max_connections = 50
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# pgBackRest needs at least replica-level WAL. Archiving itself is switched on by setup-backups.sh, once the
# backup repository exists, in teapot-archive.conf.
wal_level = replica
