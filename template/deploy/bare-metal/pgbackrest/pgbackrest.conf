# pgBackRest for teabot (D37): WAL archived continuously to an S3-compatible bucket such as DigitalOcean
# Spaces, a full backup weekly and a differential daily. setup-backups.sh installs this file as
# /etc/pgbackrest/pgbackrest.conf with the bucket and region filled in. The access key, its secret and the
# encryption passphrase live in /etc/pgbackrest/conf.d/secrets.conf, readable by root and postgres only.
[global]
repo1-type=s3
repo1-s3-endpoint=@REGION@.digitaloceanspaces.com
repo1-s3-region=@REGION@
repo1-s3-bucket=@BUCKET@
repo1-path=/teabot
repo1-cipher-type=aes-256-cbc
# Four weekly fulls: about a month of restore points, every differential and WAL segment between them.
repo1-retention-full=4
compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=detail

[teabot]
pg1-path=@PGDATA@
pg1-socket-path=/var/run/postgresql
