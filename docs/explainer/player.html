<title>teapot walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One screen: the film letterboxed on parchment, a control bar under it. */
  :root {
    --paper: #F5F0E6; --card: #FBF8F2; --ink: #3E3631; --muted: #8A7F74;
    --line: #D9D0C3; --accent: #B9775F;
    --serif: "Libertinus Serif", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px; box-sizing: border-box;
  }
  #stage { position: relative; flex: 1; min-height: 0; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; background: var(--paper); }
  .zone { position: absolute; top: 0; bottom: 0; width: 50%; cursor: pointer; }
  #zone-back { left: 0; } #zone-next { right: 0; }
  #cover {
    position: absolute; inset: 0; display: grid; place-items: center; background: var(--paper);
    text-align: center; gap: 12px; align-content: center;
  }
  #cover h1 { font-family: var(--serif); font-size: clamp(2.2rem, 7vw, 4.5rem); margin: 0; text-wrap: balance; }
  #cover p { margin: 0; color: var(--muted); }
  .meter { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  button {
    font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; min-height: 40px;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  #start { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 600; padding: 10px 28px; }
  #bar { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
  #where { flex: 1; min-width: 0; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #where b { font-family: var(--serif); font-weight: 600; }
  #where span { color: var(--muted); }
  .rotate { display: none; font-size: .9rem; }
  @media (orientation: portrait) and (max-width: 600px) { .rotate { display: block; } }
  @media (max-width: 520px) { #full { display: none; } #where span { display: none; } }
</style>

<div id="stage">
  <video id="film" playsinline muted preload="auto"></video>
  <div class="zone" id="zone-back" aria-hidden="true"></div>
  <div class="zone" id="zone-next" aria-hidden="true"></div>
  <div id="cover">
    <h1>teapot walkthrough</h1>
    <p id="status">Loading the film…</p>
    <div class="meter"><div id="meter"></div></div>
    <button id="start" hidden>Start</button>
    <p class="rotate">Turn your phone sideways for bigger slides.</p>
  </div>
</div>
<div id="bar">
  <button id="back" aria-label="Previous slide">‹ Back</button>
  <div id="where" aria-live="polite"></div>
  <button id="full">Full screen</button>
  <button id="next" aria-label="Next slide">Next ›</button>
</div>

<script>
"use strict";
const deck = /*DECK*/null;
const SRC = "teapot-walkthrough.mp4";

const film = document.getElementById("film");
const s = deck.sections;
const last = deck.frames - 1;
const at = (frame) => (Math.min(frame, last) + 0.5) / deck.fps; // the middle of a frame, so a seek lands on it
const first = (k) => (k < s.length ? s[k].frame : deck.frames);
let k = 0, playing = false, started = false;

// Load the whole film into memory first: a blob URL seeks reliably, whatever the host does with Range requests.
async function load() {
  const meter = document.getElementById("meter"), status = document.getElementById("status");
  try {
    const res = await fetch(SRC);
    if (!res.ok || !res.body) throw new Error(res.statusText);
    const total = Number(res.headers.get("content-length")) || 0;
    const reader = res.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      if (total) meter.style.width = `${Math.round((100 * got) / total)}%`;
    }
    film.src = URL.createObjectURL(new Blob(parts, { type: "video/mp4" }));
  } catch {
    film.src = SRC; // opened from a file: let the browser stream it
  }
  meter.style.width = "100%";
  film.addEventListener("loadeddata", () => {
    status.textContent = `${s.length} slides · tap the right half or press → to go on`;
    document.getElementById("start").hidden = false;
    ready(0);
  }, { once: true });
  film.load();
}

function show() {
  const j = Math.min(k, s.length - 1);
  document.getElementById("where").innerHTML =
    `<b>${j + 1} / ${s.length}</b> <span>· ${s[j].name}</span>`;
  document.getElementById("back").disabled = !started || (k === 0 && !playing);
  document.getElementById("next").disabled = !started || k >= s.length;
}
function ready(section) {
  k = Math.max(0, Math.min(section, s.length));
  playing = false;
  film.pause();
  film.currentTime = at(Math.min(first(k), last));
  show();
}
function play(section) {
  if (section >= s.length) return ready(s.length);
  k = section; playing = true;
  if (Math.abs(film.currentTime - at(first(k))) > 0.5 / deck.fps) film.currentTime = at(first(k));
  film.play().catch(() => ready(k));
  show(); watch();
}
// Stop at the end of the playing section. Per-frame callbacks where the browser has them, else every repaint.
const tick = film.requestVideoFrameCallback
  ? (fn) => film.requestVideoFrameCallback((_, meta) => fn(meta.mediaTime))
  : (fn) => requestAnimationFrame(() => fn(film.currentTime));
function watch() {
  tick((time) => {
    if (!playing) return;
    if (time * deck.fps >= first(k + 1) - 1.5 || film.ended) return ready(k + 1);
    watch();
  });
}
function next() { if (started) playing ? ready(k + 1) : play(k); }
function back() { if (started) ready(playing ? k : k - 1); }
function start() {
  started = true;
  document.getElementById("cover").hidden = true;
  play(0);
}

document.getElementById("start").addEventListener("click", start);
document.getElementById("next").addEventListener("click", next);
document.getElementById("back").addEventListener("click", back);
document.getElementById("zone-next").addEventListener("click", next);
document.getElementById("zone-back").addEventListener("click", back);
document.getElementById("full").addEventListener("click", () => {
  const el = document.documentElement;
  (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(() => {});
});
film.addEventListener("ended", () => { if (playing) ready(s.length); });
document.addEventListener("keydown", (e) => {
  if (e.target.closest?.("button") && (e.key === "Enter" || e.key === " ")) return; // the button's own click
  if (!started && (e.key === "Enter" || e.key === " ") && !document.getElementById("start").hidden) start();
  else if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key)) next();
  else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) back();
  else if (e.key === "Home") ready(0);
  else return;
  e.preventDefault();
});
show();
load();
</script>
