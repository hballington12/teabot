[project]
name = "teapot-devtools-twin"
version = "0.0.1"
description = "Declares the plugin id devtools a second time, to check duplicate ids are refused"
requires-python = ">=3.12"
dependencies = ["teapot"]

[project.entry-points."teapot.plugins"]
devtools = "teapot_devtools_twin:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teapot_devtools_twin"]

[tool.uv.sources]
teapot = { workspace = true }
