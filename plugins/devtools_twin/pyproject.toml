[project]
name = "teabot-devtools-twin"
version = "0.0.1"
description = "Declares the plugin id devtools a second time, to check duplicate ids are refused"
requires-python = ">=3.12"
dependencies = ["teabot"]

[project.entry-points."teabot.plugins"]
devtools = "teabot_devtools_twin:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_devtools_twin"]

[tool.uv.sources]
teabot = { workspace = true }
