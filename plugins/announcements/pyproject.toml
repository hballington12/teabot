[project]
name = "teabot-announcements"
version = "1.1.0.dev0"
description = "Post announcements to a channel, now or later: a first-party teabot plugin."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["teabot"]


[project.urls]
Homepage = "https://github.com/hballington12/teabot"
Documentation = "https://github.com/hballington12/teabot/tree/main/docs"
Changelog = "https://github.com/hballington12/teabot/blob/main/CHANGELOG.md"
Issues = "https://github.com/hballington12/teabot/issues"

[project.entry-points."teabot.plugins"]
announcements = "teabot_announcements:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_announcements"]

[tool.uv.sources]
teabot = { workspace = true }
