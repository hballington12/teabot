[project]
name = "teabot-announcements"
version = "0.1.0"
description = "Post announcements to a channel, a first-party teabot plugin"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["teabot"]

[project.entry-points."teabot.plugins"]
announcements = "teabot_announcements:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_announcements"]

[tool.uv.sources]
teabot = { workspace = true }
