[project]
name = "teapot-announcements"
version = "0.1.0"
description = "Post announcements to a channel, a first-party teapot plugin"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["teapot"]

[project.entry-points."teapot.plugins"]
announcements = "teapot_announcements:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teapot_announcements"]

[tool.uv.sources]
teapot = { workspace = true }
