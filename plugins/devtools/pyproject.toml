[project]
name = "teapot-devtools"
version = "0.1.0"
description = "A development-only teapot plugin that exercises the core"
requires-python = ">=3.12"
dependencies = ["teapot"]

[project.entry-points."teapot.plugins"]
devtools = "teapot_devtools:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teapot_devtools"]

[tool.uv.sources]
teapot = { workspace = true }
