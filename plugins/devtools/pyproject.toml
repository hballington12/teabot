[project]
name = "teabot-devtools"
version = "0.1.0"
description = "A development-only teabot plugin that exercises the core"
requires-python = ">=3.12"
dependencies = ["teabot"]

[project.entry-points."teabot.plugins"]
devtools = "teabot_devtools:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_devtools"]

[tool.uv.sources]
teabot = { workspace = true }
