name: Release

# A tag v<major>.<minor>.<patch> releases teabot, with its first-party plugins inside it, to PyPI through
# trusted publishing, then publishes a GitHub release with the package and the instance template (D42, D48).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.9"
          python-version: "3.12"
      - name: Check the versions, the changelog and the template against the tag
        run: uv run --no-project python scripts/release/check.py "$GITHUB_REF_NAME"
      - name: Build the package
        run: uv build --package teabot -o dist
      # The template holds no lock, so it needs nothing from PyPI and is built with the package.
      - name: Build the template
        run: uv run --no-project python scripts/release/template.py dist/teabot-template.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for teabot names this workflow and this environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.9"
      # --check-url skips files already uploaded, so a re-run carries on where the last one stopped.
      - name: Publish teabot
        # Only the package's own files: dist/ also holds the template, which is no package.
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "dist/teabot-${GITHUB_REF_NAME#v}"*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.9"
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - name: Write the release notes from the changelog
        run: uv run --no-project python scripts/release/notes.py "$GITHUB_REF_NAME" > notes.md
      # A re-run finds the release already there and carries on.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" dist/* \
            --title "teabot ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest

  docs:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Pages deploys only from main, so the docs run is started there; it builds the latest release tag. A run
      # started by this workflow's token is allowed, as a dispatch, where other events it causes start nothing.
      - name: Publish the documentation site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
