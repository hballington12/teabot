name: Release

# A tag v<major>.<minor>.<patch> releases teabot, with its first-party plugins inside it, to PyPI through
# trusted publishing, then attaches the instance template, locked against it, to a GitHub release (D42, D48).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Check the versions, the changelog and the template against the tag
        run: uv run --no-project python scripts/release/check.py "$GITHUB_REF_NAME"
      - name: Build the package
        run: uv build --package teabot -o dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for teabot names this workflow and this environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
      # --check-url skips files already uploaded, so a re-run carries on where the last one stopped.
      - name: Publish teabot
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/teabot-*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - name: Write the release notes from the changelog
        run: uv run --no-project python scripts/release/notes.py "$GITHUB_REF_NAME" > notes.md
      # A draft first: "latest" keeps pointing at the previous complete release until the template is attached,
      # so the self-hosting guide's download link never breaks.
      - name: Create the GitHub release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run finds the draft already there and carries on.
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --title "teabot ${GITHUB_REF_NAME#v}" --notes-file notes.md
      # GitHub's runners can see PyPI's index late, over fifteen minutes after an upload, so this waits up to an
      # hour, trying once a minute.
      - name: Build the template, locked against the package just published
        run: uv run --no-project python scripts/release/template.py "$GITHUB_REF_NAME" teabot-template.tar.gz
      - name: Attach the template and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" teabot-template.tar.gz --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
