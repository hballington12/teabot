name: Docs

# Builds the documentation site from the latest release tag and publishes it to GitHub Pages. The release workflow
# calls it as its last job, since a release published with GitHub's own token starts no other workflow; it also
# runs by hand. The site therefore describes the latest release, never unreleased work on main. A docs fix ships
# in a patch release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the latest release tag
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "building the docs of $tag"
          git checkout --quiet "$tag"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv run --locked --group docs zensical build --strict
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
