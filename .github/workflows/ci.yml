name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teabot_owner
          POSTGRES_PASSWORD: teabot
          POSTGRES_DB: teabot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U teabot_owner -d teabot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # The uv the template's Compose file runs, so CI and instances resolve alike.
          version: "0.9.9"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # The uv the template's Compose file runs, so CI and instances resolve alike.
          version: "0.9.9"
          python-version: "3.12"
      # --strict fails on a broken link, anchor or included file, so none can reach main unnoticed.
      - run: uv run --locked --group docs zensical build --strict
